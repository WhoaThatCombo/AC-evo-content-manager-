# Build ACECM.exe and attach it to a GitHub Release.
#
# The in-app updater reads the latest Release and looks for an asset named
# exactly `ACECM.exe`, so that name matters. Tag a version to publish:
#
#     git tag v0.4.0 && git push origin v0.4.0
#
# Two jobs, one release. The Windows build produces `ACECM.exe`; the Linux
# build produces `ACECM` (no extension), which is the asset name the Linux
# updater looks for. Neither is cross-compiled - each runs natively.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # lets you build without tagging, to test

permissions:
  contents: write             # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller protobuf numpy pywebview cryptography websockets capstone texture2ddecoder pillow

      - name: Check the version matches the tag
        # A build whose reported version does not match its tag makes the
        # updater loop: it downloads "0.4.0", still reports 0.3.0, and offers
        # the same update forever.
        #
        # ⚠ Tag pushes only. On workflow_dispatch GITHUB_REF_NAME is the
        # BRANCH, so this compared "linux-port" against "1.0.0" and failed -
        # which made the manual trigger, the one meant for testing a build
        # without tagging, impossible to use.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('acecm/version.py').read()).group(1))")
          echo "tag=$TAG  acecm/version.py=$VER"
          if [ -n "$TAG" ] && [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match VERSION $VER in acecm/version.py"
            exit 1
          fi

      - name: Build
        run: python build.py --clean

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum ACECM.exe | tee ACECM.exe.sha256

      - name: Skip upload if the release already has ACECM.exe
        # Local tools/publish_release.py ships first. Re-uploading the same
        # tag from CI replaces the blob and the in-app updater 404s.
        id: already
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}")
          echo "http=$CODE"
          if [ "$CODE" = "200" ]; then echo "exists=yes" >> "$GITHUB_OUTPUT"
          else echo "exists=no" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.already.outputs.exists != 'yes'
        with:
          files: |
            dist/ACECM.exe
            dist/ACECM.exe.sha256
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: ACECM-exe
          path: dist/ACECM.exe

  linux:
    # ⚠ needs: build. One release, two jobs. Uploading concurrently races on
    # creating it, and worse, the "does this release already exist" guard each
    # job runs would see the OTHER job's upload and skip its own. Serialising
    # costs a few minutes and removes both failure modes.
    needs: build
    runs-on: ubuntu-latest
    # ⚠ Build in an OLD distro, not on ubuntu-latest. A PyInstaller onefile
    # links against the glibc of the machine that built it and refuses to
    # start on anything older, so an ubuntu-latest build (glibc 2.39) would
    # die on Debian stable, Ubuntu 22.04 and SteamOS - the machines most
    # likely to be running this. AlmaLinux 8 is glibc 2.28 (RHEL 8 / Ubuntu
    # 18.10 and newer), and 2.28 is also the oldest glibc the runner's own
    # node can use, so it is the lowest floor a job here can reach.
    #
    # ⚠ AlmaLinux, not quay.io/pypa/manylinux_2_28 - which is the same glibc
    # and the obvious choice. Its bundled interpreters are built static, and
    # PyInstaller refuses outright: "Python was built without a shared
    # library". The distro's own python3.12 is a normal shared build.
    container: almalinux:8
    steps:
      - name: Install Python and build tools
        # ⚠ Before checkout would need it: git, or actions/checkout falls back
        # to a REST tarball. binutils is for objdump in the glibc-floor step.
        # actions/setup-python is deliberately NOT used - it would install a
        # build made against a newer glibc and undo the whole point.
        run: |
          dnf -y install --setopt=install_weak_deps=False             git gcc gcc-c++ make binutils findutils
          # ⚠ -pip as well: the base python3.12 package does not carry it,
          # and the next step died on "No module named pip".
          if dnf -y install python3.12 python3.12-devel python3.12-pip; then PY=python3.12
          elif dnf -y install python3.11 python3.11-devel python3.11-pip; then PY=python3.11
          else dnf -y install python39 python39-devel python39-pip && PY=python3.9; fi
          ln -sf "$(command -v $PY)" /usr/local/bin/python
          python --version
          python -m pip --version || python -m ensurepip --upgrade
          # PyInstaller needs a shared libpython; this must print 1.
          python -c "import sysconfig;print('shared libpython:', sysconfig.get_config_var('Py_ENABLE_SHARED'))"

      - uses: actions/checkout@v4

      - name: Install dependencies
        # ⚠ From requirements-linux.txt, not a hand-copied list: it is what a
        # source install uses, so the two cannot drift. The extras match the
        # Windows job - texture2ddecoder and Pillow are imported lazily, and
        # without them the build silently ships four track covers instead of
        # nineteen with nothing in the log saying why.
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller texture2ddecoder capstone certifi                       -r requirements-linux.txt

      - name: Check the version matches the tag
        # Tag pushes only - see the note in the windows job.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('acecm/version.py').read()).group(1))")
          echo "tag=$TAG  acecm/version.py=$VER"
          if [ -n "$TAG" ] && [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match VERSION $VER in acecm/version.py"
            exit 1
          fi

      - name: Build
        run: python build.py --clean

      - name: Report the glibc floor
        # The number this prints IS the compatibility answer: the oldest glibc
        # that can run the binary. If it ever rises above 2.28 the container
        # changed under us and the build quietly stopped working on older
        # distros - which nobody would notice until a user reported it.
        run: |
          FLOOR=$(objdump -T dist/ACECM | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol required: $FLOOR"
          echo "Linux build requires glibc >= $FLOOR" >> "$GITHUB_STEP_SUMMARY"
          MIN=$( { echo "$FLOOR"; echo 2.28; } | sort -V | head -1 )
          if [ "$MIN" != "2.28" ]; then
            echo "::warning::glibc floor rose to $FLOOR (was 2.28); older distros lose support"
          fi

      - name: Checksum
        run: |
          cd dist
          sha256sum ACECM | tee ACECM.sha256

      - name: Skip upload if the release already has ACECM
        # Asset-level, not release-level: by now the Windows job has created
        # the release, so asking "does the release exist" would always be yes
        # and this job would never upload anything.
        id: already
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          HAVE=$(curl -s             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${{ github.token }}"             "https://api.github.com/repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}"             | grep -o '"name": *"ACECM"' | head -1)
          if [ -n "$HAVE" ]; then echo "exists=yes" >> "$GITHUB_OUTPUT"
          else echo "exists=no" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.already.outputs.exists != 'yes'
        with:
          files: |
            dist/ACECM
            dist/ACECM.sha256

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: ACECM-linux
          path: dist/ACECM
