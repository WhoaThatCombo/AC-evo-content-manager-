[package]
name = "acecm"
version = "1.0.21"
edition = "2021"
description = "Assetto Corsa EVO Content Manager - native shell"
license = "GPL-3.0-or-later"
publish = false
default-run = "acecm"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
http-body-util = "0.1"
getrandom = "0.3"
regex-lite = "0.1"
prost = "0.13"
sha1_smol = "1"
base64 = "0.22"
flate2 = "1"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Storage_FileSystem"] }
winreg = "0.55"
