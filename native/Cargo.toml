[package]
name = "acecm"
version = "1.1.1"
edition = "2021"
description = "Assetto Corsa EVO Content Manager - native shell"
license = "GPL-3.0-or-later"
publish = false
default-run = "acecm"

[features]
# "ACECM Dev": installs and runs beside the normal ACECM (see src/edition.rs)
dev-edition = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "rustls-tls-native-roots", "blocking", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
http-body-util = "0.1"
getrandom = "0.3"
regex-lite = "0.1"
prost = "0.13"
sha1_smol = "1"
base64 = "0.22"
memchr = "2"
rsa = "0.9"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
x509-parser = "0.16"
time = "0.3"
libloading = "0.8"
sha2 = "0.10"
md-5 = "0.10"
ed25519-dalek = "2"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel"] }
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
texture2ddecoder = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
flate2 = "1"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation"] }
winreg = "0.55"
