<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACECM Live</title>
<link rel="stylesheet" href="/style.css">
<style>
  nav{display:none}
  body{display:block;overflow:auto}
  main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
  header{border:0;padding:8px 0 14px}
  #map{width:100%;height:min(62vh,640px);display:block;background:#0a0c10;border-radius:12px}
  .live-id{color:var(--dim2);font-size:12px}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="ttl">Live</h1>
      <div class="sub" id="sub">Shared telemetry — read only</div>
    </div>
  </header>
  <div class="card">
    <div class="row wrap" style="margin-bottom:10px">
      <span class="pill off" id="st"><i class="dot"></i>connecting</span>
    </div>
    <canvas id="map"></canvas>
    <div class="tiny dim" style="margin-top:8px">Cars only appear once they move.
      Several leaving the pits together stay unlabeled rather than guessed.</div>
  </div>
  <div class="card">
    <h2>Leaderboard</h2>
    <div id="board"></div>
  </div>
  <div class="card">
    <h2>On track</h2>
    <div id="list"></div>
  </div>
</main>
<script src="/live.js"></script>
</body>
</html>
