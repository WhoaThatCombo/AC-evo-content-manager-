<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assetto Corsa EVO Content Manager</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
  <div class="brand">
    <div class="mark"></div>
    <div><b>EVO Content Manager</b><small>Assetto Corsa EVO</small></div>
  </div>
  <a data-page="dashboard" class="on"><span class="ico">◆</span> Dashboard</a>
  <a data-page="servers"><span class="ico">▤</span> Servers</a>
  <a data-page="cars"><span class="ico">▮</span> Cars</a>
  <a data-page="tracks"><span class="ico">◎</span> Tracks</a>
  <a data-page="content"><span class="ico">⬇</span> Content</a>
  <a data-page="backend"><span class="ico">⇄</span> Backend</a>
  <a data-page="browser"><span class="ico">◈</span> Server browser</a>
  <a data-page="telemetry"><span class="ico">◉</span> Telemetry</a>
  <a data-page="patches"><span class="ico">⚒</span> Patches</a>
  <a data-page="gamesettings"><span class="ico">☰</span> Game settings</a>
  <a data-page="logs"><span class="ico">▤</span> Logs</a>
  <a data-page="settings"><span class="ico">⚙</span> Settings</a>
  <div class="spacer"></div>
  <div class="foot" id="navfoot">—</div>
</nav>

<main>
  <header>
    <div>
      <h1 id="ttl">Dashboard</h1>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
    <div class="grow"></div>
    <div id="hdr" class="row"></div>
  </header>
  <div class="page" id="page"></div>
</main>

<div id="toast"></div>
<script>
window.addEventListener('error', function (e) {
  var p = document.getElementById('page');
  if (p && !p.dataset.booted) {
    p.innerHTML = '<div class="err"><b>UI script failed</b><br>'
      + String(e.message || e) + '</div>';
  }
});
</script>
<script src="/app.js"></script>
</body>
</html>
