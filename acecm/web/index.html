<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assetto Corsa EVO Content Manager</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/redesign.css">
<script>
// Apply the saved theme before first paint, so there is no flash of the
// default accent on every load.
// ⚠ The server injects the saved theme into __ACECM_THEME__ below. It has to,
// because localStorage cannot be relied on across an update: ui._storage_path
// deletes the whole WebView2 profile whenever the version changes (to avoid
// painting yesterday's JS), which took the chosen accent with it every time.
var t = '__ACECM_THEME__';
try {
  t = localStorage.getItem('acecm.theme') || t;
} catch (e) {}
if (t && t !== '__ACECM' + '_THEME__') document.documentElement.dataset.theme = t;
</script>
</head>
<body>

<!-- Sidebar shell (2026-10 redesign). Every id the scripts use is kept:
     #sections / #sections2 are built by buildSections(), #subnav by paintNav,
     #sidestat by the live feed. -->
<aside class="side" aria-label="ACECM">
  <a class="brand" id="brand" title="Home">
    <span class="mark" aria-hidden="true"></span>
    <span class="wordmark">ACECM</span>
  </a>
  <nav id="sections" aria-label="Sections"></nav>
  <div class="side-fill"></div>
  <nav id="sections2" aria-label="Settings and diagnostics"></nav>
  <div id="sidestat" class="side-stat" aria-live="polite"></div>
</aside>
<main>
  <header>
    <div class="bar">
      <h1 id="ttl"></h1>
      <!-- pages within the current section (Content: Install & share / Tracks) -->
      <nav id="subnav" hidden></nav>
      <div class="grow"></div>
      <div id="hdr" class="row"></div>
      <button id="themebtn" class="themebtn" title="Colour theme" aria-label="Colour theme"></button>
    </div>
    <div class="sub" id="sub" hidden></div>
  </header>
  <!-- What is happening right now, and anything actually wrong - every page. -->
  <div id="activity" hidden></div>
  <div id="attention"></div>
  <div class="page" id="page"></div>
</main>

<div id="dropveil"><div>Drop a car mod or track pack to install</div></div>
<div id="toast"></div>
<div id="thememenu" class="thememenu" hidden></div>
<script>
window.addEventListener('error', function (e) {
  var p = document.getElementById('page');
  if (p && !p.dataset.booted) {
    p.innerHTML = '<div class="err"><b>UI script failed</b><br>'
      + String(e.message || e) + '</div>';
  }
});
</script>
<!-- The UI, as ordered classic scripts sharing one global scope (not ES
     modules: the pages call each other and the router rebinds them by
     name). ORDER MATTERS only in that 15-nav.js, which boots the app,
     comes last. -->
<script src="/js/01-core.js"></script>
<script src="/js/02-drive.js"></script>
<script src="/js/03-shared.js"></script>
<script src="/js/04-servers.js"></script>
<script src="/js/05-cars.js"></script>
<script src="/js/06-tracks.js"></script>
<script src="/js/07-backend.js"></script>
<script src="/js/08-settings.js"></script>
<script src="/js/09-content.js"></script>
<script src="/js/10-patches.js"></script>
<script src="/js/11-gamesettings.js"></script>
<script src="/js/12-remote.js"></script>
<script src="/js/13-telemetry.js"></script>
<script src="/js/14-logs.js"></script>
<script src="/js/14b-home.js"></script>
<script src="/js/15-nav.js"></script>
</body>
</html>
