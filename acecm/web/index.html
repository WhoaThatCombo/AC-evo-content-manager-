<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assetto Corsa EVO Content Manager</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main>
  <!-- Content Manager's own arrangement: no sidebar. The active section is the
       page title, and the other sections sit beside it in grey. The rarely
       used ones (patches, logs, settings…) go to the right so the row that
       matters stays short. -->
  <header>
    <div class="topline">
      <div class="mark" title="Assetto Corsa EVO Content Manager"></div>
      <h1 id="ttl">Drive</h1>
      <div class="grow"></div>
      <nav id="sections2"></nav>
    </div>
    <!-- ⚠ On its own line, and every section always present. Sharing a line
         with the title made the row slide sideways whenever the title's length
         changed ("cars" vs "server browser"), so the link you were aiming at
         moved between clicks. -->
    <nav id="sections"></nav>
    <div class="subline">
      <div class="sub" id="sub">&nbsp;</div>
      <div class="grow"></div>
      <div id="hdr" class="row"></div>
      <div class="foot" id="navfoot">—</div>
    </div>
  </header>
  <!-- Anything actually wrong, on every page. Empty and invisible when there
       is nothing to report. -->
  <div id="attention"></div>
  <div class="page" id="page"></div>
</main>

<div id="dropveil"><div>Drop a car mod or track pack to install</div></div>
<div id="toast"></div>
<script>
window.addEventListener('error', function (e) {
  var p = document.getElementById('page');
  if (p && !p.dataset.booted) {
    p.innerHTML = '<div class="err"><b>UI script failed</b><br>'
      + String(e.message || e) + '</div>';
  }
});
</script>
<script src="/app.js"></script>
</body>
</html>
