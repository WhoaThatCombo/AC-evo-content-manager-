<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assetto Corsa EVO Content Manager</title>
<link rel="stylesheet" href="/style.css">
<script>
// Apply the saved theme before first paint, so there is no flash of the
// default accent on every load.
// ⚠ The server injects the saved theme into __ACECM_THEME__ below. It has to,
// because localStorage cannot be relied on across an update: ui._storage_path
// deletes the whole WebView2 profile whenever the version changes (to avoid
// painting yesterday's JS), which took the chosen accent with it every time.
var t = '__ACECM_THEME__';
try {
  t = localStorage.getItem('acecm.theme') || t;
} catch (e) {}
if (t && t !== '__ACECM' + '_THEME__') document.documentElement.dataset.theme = t;
</script>
</head>
<body>

<main>
  <!-- One centred bar. The active section is the only title we need, so the
       old 34px heading and its subtitle are gone - they cost ~125px of every
       page and mostly repeated the highlighted nav word underneath them.
       Left / centre / right are grid columns so the nav is centred on the
       WINDOW, not on whatever happens to be beside it. -->
  <header>
    <div class="bar">
      <div class="barL">
        <!-- The mark used to sit beside a 34px title; alone it read as a stray
             dot, so it is a proper lockup now. Clicking it goes home. -->
        <a class="brand" id="brand" title="Assetto Corsa EVO Content Manager">
          <span class="mark"></span>
          <span class="wordmark">ACECM</span>
        </a>
      </div>
      <div class="barC">
        <nav id="sections"></nav>
      </div>
      <!-- Settings sits far right, away from the sections you move between.
           The "server ready" line is gone: it was permanent furniture that
           said the same thing on every page, and a genuine problem already
           shows up in the attention banner below. -->
      <div class="barR">
        <div id="hdr" class="row"></div>
        <nav id="sections2"></nav>
        <button id="themebtn" class="themebtn" title="Colour theme"></button>
      </div>
    </div>
    <!-- kept for the router, which still sets them; not displayed -->
    <h1 id="ttl" hidden></h1>
    <div class="sub" id="sub" hidden></div>
  </header>
  <!-- Anything actually wrong, on every page. Empty and invisible when there
       is nothing to report. -->
  <!-- What is happening right now - a join, a download, compression, your
       running servers - on every page, from the one live feed. -->
  <div id="activity" hidden></div>
  <div id="attention"></div>
  <div class="page" id="page"></div>
</main>

<div id="dropveil"><div>Drop a car mod or track pack to install</div></div>
<div id="toast"></div>
<div id="thememenu" class="thememenu" hidden></div>
<script>
window.addEventListener('error', function (e) {
  var p = document.getElementById('page');
  if (p && !p.dataset.booted) {
    p.innerHTML = '<div class="err"><b>UI script failed</b><br>'
      + String(e.message || e) + '</div>';
  }
});
</script>
<script src="/app.js"></script>
</body>
</html>
